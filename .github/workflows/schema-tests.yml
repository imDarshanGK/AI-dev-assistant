name: Schema Smoke Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/app/models.py"
      - "backend/app/database.py"
      - "backend/app/services/database.py"
      - "backend/tests/test_schema_smoke.py"
      - ".github/workflows/schema-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/models.py"
      - "backend/app/database.py"
      - "backend/app/services/database.py"
      - "backend/tests/test_schema_smoke.py"
      - ".github/workflows/schema-tests.yml"

jobs:
  schema-smoke:
    name: Schema Smoke Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PostgreSQL 16 on runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg2 lsb-release ca-certificates
          # Add PostgreSQL Apt repo
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          # Start PostgreSQL and create user+db
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER smoke WITH PASSWORD 'smoke';" || true
          sudo -u postgres psql -c "CREATE DATABASE smoke_db OWNER smoke;" || true
          # Wait until ready
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U smoke && break
            sleep 1
          done

      - name: Install libmagic
        run: sudo apt-get update -qq && sudo apt-get install -y libmagic1 libmagic-dev

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PostgreSQL driver
        run: python -m pip install psycopg2-binary

      - name: Run schema smoke tests
        env:
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke_db
          RATE_LIMIT_PER_MINUTE: 300
        run: python -m pytest tests/test_schema_smoke.py -v --tb=short
